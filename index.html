<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShowMeYourTDs</title>
<meta name="description" content="Live standings, odds, matchups, and NFL play-by-play tendencies for the ShowMeYourTDs fantasy league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* arcade entry point in the scoreboard header — reads as a cabinet button */
  .arcade-link {
    color: #0B0B0B; background: var(--accent); border: 2px solid var(--gold);
    padding: 3px 8px; text-decoration: none; box-shadow: 2px 2px 0 rgba(0,0,0,.7);
    display: inline-block;
  }
  .arcade-link:hover { background: var(--gold); }

  :root {
    /* 8-bit Madden: night turf, chalk lines, arcade amber */
    --bg: #07140C;
    --surface: #0E2415;
    --surface-2: #143019;
    --line: rgba(244,246,232,0.16);
    --line-strong: #2C7A3F;
    --text: #F4F6E8;
    --text-dim: #9FD39F;
    --text-faint: #5F8F67;
    --accent: #FFB000;
    --accent-soft: rgba(255,176,0,0.16);
    --gold: #FFD93B;
    --good: #3DDC63;
    --good-soft: rgba(61,220,99,0.16);
    --bad: #FF4B3E;
    --bad-soft: rgba(255,75,62,0.16);
    --info: #46B1FF;
    --font-display: "Press Start 2P", "Courier New", monospace;
    --font-body: "VT323", "Courier New", monospace;
    --font-label: "Press Start 2P", "Courier New", monospace;
    --font-mono: "VT323", ui-monospace, Menlo, monospace;
    --pix: 3px;
    --hard: 4px 4px 0 rgba(0,0,0,0.7);
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 1200px 500px at 50% -100px, rgba(255,106,43,0.08), transparent 60%);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px 64px;
  }

  /* ---- header / scoreboard bar ---- */
  header.board {
    border-bottom: 3px solid var(--accent);
    background: linear-gradient(180deg, rgba(255,106,43,0.07), transparent);
    padding: 28px 20px 18px;
    margin-bottom: 4px;
  }
  .board-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 24px;
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: clamp(34px, 5vw, 52px);
    letter-spacing: 0.02em;
    line-height: 1;
    text-wrap: balance;
  }
  .wordmark span { color: var(--accent); }
  .board-meta {
    display: flex;
    align-items: baseline;
    gap: 18px;
    font-family: var(--font-label);
    color: var(--text-dim);
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  .board-meta strong {
    color: var(--text);
    font-family: var(--font-mono);
    font-weight: 600;
  }

  /* ---- ticker ---- */
  .ticker {
    display: flex;
    gap: 0;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    font-family: var(--font-label);
    font-size: 14px;
  }
  .ticker-item {
    flex: none;
    padding: 10px 22px;
    border-right: 1px solid var(--line);
    white-space: nowrap;
    color: var(--text-dim);
  }
  .ticker-item b { color: var(--gold); font-weight: 600; }

  main { padding-top: 28px; }

  .grid {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .panel.info-accent { border-top-color: var(--info); }
  .panel.gold-accent { border-top-color: var(--gold); }

  .panel h2 {
    font-family: var(--font-display);
    font-size: 21px;
    letter-spacing: 0.03em;
    margin: 0;
    padding: 14px 18px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .panel h2 small {
    font-family: var(--font-label);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .panel-body { padding: 0 18px 18px; }
  .panel-note {
    font-family: var(--font-label);
    font-size: 12.5px;
    color: var(--text-faint);
    padding: 10px 18px 14px;
    border-top: 1px solid var(--line);
    margin-top: 4px;
  }

  table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 13.5px; }
  th {
    white-space: nowrap;
    font-family: var(--font-label);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11px;
    color: var(--text-faint);
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .num { font-family: var(--font-mono); }
  .team-cell { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .rank { color: var(--text-faint); font-family: var(--font-mono); width: 1.4em; display: inline-block; }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 3px;
    object-fit: cover;
    flex: none;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
  }
  .avatar.sm { width: 20px; height: 20px; border-radius: 2px; }
  .avatar.lg { width: 40px; height: 40px; border-radius: 4px; }
  .you-flag {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: 0.05em;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 2px;
    font-weight: 600;
  }
  .table-scroll { overflow-x: auto; }

  .overflow-scroll { overflow-x: auto; }

  /* matchup cards */
  .matchups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .matchup {
    background: var(--surface);
    padding: 14px 16px;
  }
  .matchup-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
  }
  .matchup-row .name { font-weight: 500; display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .matchup-row .name .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .matchup-row .name.user { color: var(--accent); font-weight: 600; }
  .proj-tag {
    font-family: var(--font-label);
    font-size: 9px;
    letter-spacing: 0.05em;
    font-weight: 600;
    color: var(--good);
    background: var(--good-soft);
    border: 1px solid var(--good);
    padding: 1px 5px;
    flex: none;
    white-space: nowrap;
  }
  .matchup-row .pct { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .matchup-row .pts { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }

  .matchup-row .pts .proj { display: block; font-size: 10.5px; font-weight: 400; color: var(--text-faint); text-align: right; }
  .matchup-row .pts .now { color: var(--text); }
  .progress-line { font-family: var(--font-label); font-size: 11px; color: var(--text-faint); letter-spacing: 0.03em; padding: 0 0 4px; }
  .progress-line .livepill { color: var(--accent); font-weight: 600; }
  .alert-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 6px; }
  .alert-chip { font-family: var(--font-label); font-size: 10.5px; padding: 1px 6px; border-radius: 2px; white-space: nowrap; }
  .alert-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .alert-chip.warn { background: var(--accent-soft); color: var(--accent); }
  .lineup-details { margin-top: 6px; }
  .lineup-details summary { cursor: pointer; font-family: var(--font-label); font-size: 11px; color: var(--text-faint); letter-spacing: 0.05em; }
  .lineup-details summary:hover { color: var(--text-dim); }
  .lu-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .lu-row:last-child { border-bottom: none; }
  .lu-pos { flex: 0 0 30px; color: var(--text-faint); font-family: var(--font-label); font-size: 11px; }
  .lu-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lu-state { flex: none; font-family: var(--font-label); font-size: 9.5px; letter-spacing: 0.05em; color: var(--text-faint); }
  .lu-state.live { color: var(--accent); font-weight: 600; }
  .lu-pts { flex: 0 0 44px; text-align: right; font-family: var(--font-mono); }
  .matchup-vs {
    text-align: center;
    font-family: var(--font-label);
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    padding: 2px 0;
  }
  .win-bar {
    height: 3px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    margin-top: 8px;
  }
  .win-bar > span { display: block; height: 100%; background: var(--accent); }

  /* list rows: performers / injuries / market */
  .list-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .left { min-width: 0; }
  .list-row .primary { font-weight: 500; }
  .list-row .secondary { font-size: 12px; color: var(--text-faint); font-family: var(--font-label); }
  .list-row .val { font-family: var(--font-mono); font-weight: 500; white-space: nowrap; }
  .pill {
    font-family: var(--font-label);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 1px 7px;
    border-radius: 2px;
    font-weight: 600;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: rgba(111,168,216,0.14); color: var(--info); }
  .pill.good { background: var(--good-soft); color: var(--good); }

  .waiver-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .waiver-row:last-child { border-bottom: none; }
  .waiver-row .wmoves { font-size: 13px; line-height: 1.5; }
  .waiver-row .wmoves .add { color: var(--good); }
  .waiver-row .wmoves .drop { color: var(--bad); }
  .faab-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .faab-row .fname { flex: 0 0 150px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; overflow: hidden; }
  .faab-row .fname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .faab-bar-track { flex: 1; height: 16px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .faab-bar-fill { height: 100%; background: var(--good); border-radius: 2px; }
  .faab-val { flex: 0 0 46px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-dim); }


  .highlight-grid .collapsible { display: contents; }
  .highlight-grid .more-btn { grid-column: 1 / -1; }
  .collapsible:not(.open) [data-extra] { display: none; }
  .more-btn { display: block; width: 100%; margin-top: 8px; padding: 7px 10px; background: var(--surface-2); color: var(--text-dim);
    border: 1px solid var(--line-strong); font-family: var(--font-label); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
  .more-btn:hover { color: var(--text); border-color: var(--accent); }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .injpred-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .injpred-row:last-child { border-bottom: none; }
  .injpred-top { display: flex; align-items: center; gap: 10px; }
  .injpred-name { flex: 1; min-width: 0; font-size: 13.5px; }
  .injpred-name .pname { font-weight: 500; }
  .injpred-bar-track { flex: 0 0 90px; height: 14px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .injpred-bar-fill { height: 100%; background: var(--bad); border-radius: 2px; }
  .injpred-games { flex: 0 0 70px; text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .injpred-note { font-size: 12px; color: var(--text-faint); font-family: var(--font-label); margin-top: 5px; line-height: 1.5; }

  .pod-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .pod-card { background: var(--surface-2); border: 1px solid var(--line); padding: 14px 16px; }
  .pod-card.mine { border-color: var(--accent); }
  .pod-story { font-size: 13px; line-height: 1.55; color: var(--text-dim); margin: 0 0 10px; }
  .pod-story b { color: var(--text); }
  .pod-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .pod-row .team-cell { flex: 1; min-width: 0; }
  .pod-row .pod-rec { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); flex: 0 0 40px; text-align: right; }
  .pod-row .pod-po { font-family: var(--font-mono); font-size: 12px; flex: 0 0 44px; text-align: right; }

  .sens-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .sens-row:last-child { border-bottom: none; }
  .sens-name { flex: 0 0 150px; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sens-range { flex: 1; position: relative; height: 16px; background: var(--surface-2); border-radius: 2px; }
  .sens-range .sens-bar { position: absolute; top: 3px; bottom: 3px; background: var(--info); opacity: 0.35; border-radius: 2px; }
  .sens-range .sens-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--text); }
  .sens-range .sens-tick.base { background: var(--accent); width: 3px; }
  .sens-val { flex: 0 0 100px; text-align: right; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); }
  .sens-legend { display: flex; gap: 16px; font-family: var(--font-label); font-size: 11px; color: var(--text-faint); margin-bottom: 8px; flex-wrap: wrap; }
  .sens-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .sens-legend i { width: 9px; height: 9px; display: inline-block; border-radius: 2px; }

  .empty-note {
    color: var(--text-faint);
    font-family: var(--font-label);
    font-size: 13px;
    padding: 12px 0;
  }

  footer {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-family: var(--font-label);
    font-size: 12px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  footer a { color: var(--text-dim); text-decoration: underline; text-underline-offset: 2px; }

  .skel { color: var(--text-faint); font-family: var(--font-label); padding: 40px 20px; text-align: center; }

  /* highlights */
  .filter-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding: 12px 18px 4px;
  }
  .filter-btn {
    font-family: var(--font-label);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--line-strong);
    padding: 5px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-btn:hover { border-color: var(--text-faint); color: var(--text); }
  .filter-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .highlight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    padding: 14px 18px 18px;
  }
  .highlight-card {
    display: block;
    text-decoration: none;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .highlight-card:hover { border-color: var(--accent); }
  .highlight-thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #0a0f0c;
  }
  .highlight-meta { padding: 10px 12px 12px; }
  .highlight-headline {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.35;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .highlight-tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .highlight-tags .avatar.sm { margin-right: -2px; }
  .highlight-src {
    font-family: var(--font-label);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .recap-strip {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 0 18px 14px;
    font-family: var(--font-label);
    font-size: 12.5px;
  }
  .recap-strip a {
    color: var(--text-dim);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 1px dotted var(--line-strong);
    flex: none;
  }
  .recap-strip a:hover { color: var(--accent); border-color: var(--accent); }

  /* weekly awards */
  .award-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 1px;
  }
  .award-card {
    background: var(--surface);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .award-card .label {
    font-family: var(--font-label);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .award-card .value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
  .award-card .sub { font-family: var(--font-label); font-size: 12px; color: var(--text-dim); }
  .award-card.best .value { color: var(--good); }
  .award-card.worst .value { color: var(--bad); }

  .position-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .position-card {
    background: var(--surface);
    padding: 14px 12px;
    text-align: center;
  }
  .position-card .pos-label {
    font-family: var(--font-label);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .headshot {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    margin: 0 auto 8px;
    display: block;
  }
  .headshot.def {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 16px; color: var(--text-dim);
  }
  .position-card .pname { font-size: 12.5px; font-weight: 500; margin-bottom: 2px; line-height: 1.25; }
  .position-card .ppts { font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--accent); }
  .position-card .powner { font-family: var(--font-label); font-size: 10.5px; color: var(--text-faint); margin-top: 3px; }

  .eff-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .eff-row .eff-name { flex: 0 0 150px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; overflow: hidden; }
  .eff-row .eff-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .eff-bar-track { flex: 1; height: 16px; background: var(--surface-2); border-radius: 2px; overflow: hidden; position: relative; }
  .eff-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .eff-pct { flex: 0 0 42px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-dim); }

  /* =================== 8-BIT MADDEN THEME =================== */
  @keyframes blink8 { 0%,55% { opacity: 1 } 56%,100% { opacity: .28 } }

  *, *::before, *::after { border-radius: 0 !important; }

  body {
    font-family: var(--font-body);
    font-size: 19px;
    line-height: 1.35;
    background-color: var(--bg);
    background-image:
      repeating-linear-gradient(90deg, rgba(244,246,232,.05) 0 2px, transparent 2px 60px),
      linear-gradient(180deg, #0A2011 0%, #07140C 55%);
  }
  /* CRT scanlines + vignette, purely decorative */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(0,0,0,.5) 100%);
  }
  img, .avatar, .headshot, .highlight-thumb { image-rendering: pixelated; }

  /* ---- type ---- */
  h1, h2, h3, .wordmark, .label, .pos-label, .rank, .proj-tag, .livepill,
  .pill, .filter-btn, .more-btn, .ticker-item, .alert-chip, .matchup-vs,
  .sens-legend, .board-meta, footer { font-family: var(--font-display); text-transform: uppercase; }
  .panel h2 { font-size: 11px; line-height: 1.7; letter-spacing: 0; color: var(--accent); }
  .panel h2 small { font-size: 8px; color: var(--text-faint); display: block; margin-top: 6px; }
  .tabular, .num, .val, .pts, .pct, .value, table, td, th { font-family: var(--font-mono); font-size: 19px; }

  /* ---- header: turf + yard lines ---- */
  header.board {
    border-bottom: 4px solid var(--accent);
    background:
      repeating-linear-gradient(90deg, rgba(244,246,232,.08) 0 3px, transparent 3px 54px),
      linear-gradient(180deg, #16451F, #0A2412);
  }
  .wordmark {
    font-size: 24px; color: var(--accent); line-height: 1.5;
    text-shadow: 3px 3px 0 #000, 6px 6px 0 rgba(255,75,62,.55);
  }
  .board-meta { font-size: 9px; color: var(--text-dim); }
  .board-meta strong { color: var(--gold); }

  /* ---- panels: chunky borders, hard shadows ---- */
  .panel {
    border: var(--pix) solid var(--line-strong);
    background: var(--surface);
    box-shadow: var(--hard);
  }
  .panel h2 {
    background: linear-gradient(180deg, #1B4A26, #10301A);
    border-bottom: var(--pix) solid var(--line-strong);
  }
  .panel.gold-accent { border-color: var(--gold); }
  .panel.gold-accent h2 { color: var(--gold); }
  .panel.info-accent { border-color: var(--info); }
  .panel.info-accent h2 { color: var(--info); }

  /* ---- ticker: arcade marquee ---- */
  .ticker {
    border-top: var(--pix) solid var(--line-strong);
    border-bottom: var(--pix) solid var(--line-strong);
    background: #0A2412;
  }
  .ticker-item { font-size: 9px; }

  /* ---- matchup cards ---- */
  .matchup { border: var(--pix) solid var(--line-strong); box-shadow: var(--hard); background: var(--surface-2); }
  .matchup-vs { font-size: 10px; color: var(--bad); text-shadow: 2px 2px 0 #000; }
  .livepill { animation: blink8 1.1s steps(1, end) infinite; border: 2px solid currentColor; }

  /* ---- bars become segmented LED meters ---- */
  .win-bar, .faab-bar-fill, .eff-bar-fill, .injpred-bar-fill, .sens-bar {
    background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 2px, transparent 2px 9px);
  }
  .faab-bar-track, .eff-bar-track, .injpred-bar-track { border: 2px solid #000; background: #081B0E; }

  /* ---- pixel buttons ---- */
  .filter-btn, .more-btn {
    font-size: 9px; padding: 9px 11px; color: var(--text);
    background: #10301A; border: 2px solid var(--line-strong); box-shadow: 3px 3px 0 #000;
  }
  .filter-btn:hover, .more-btn:hover { background: #17421F; }
  .filter-btn:active, .more-btn:active { transform: translate(3px, 3px); box-shadow: none; }
  .filter-btn.active, .filter-btn[aria-pressed="true"] { background: var(--accent); color: #140A00; border-color: var(--gold); }

  /* ---- chips, pills, tags ---- */
  .pill, .alert-chip, .proj-tag, .pos-label, .you-flag {
    font-size: 8px; padding: 5px 7px; border: 2px solid currentColor; background: rgba(0,0,0,.35);
  }

  /* ---- tables: chalk rules ---- */
  table { border-collapse: collapse; }
  th { font-family: var(--font-display); font-size: 8px; color: var(--text-faint); padding-bottom: 10px; }
  td { border-top: 2px solid rgba(244,246,232,.10); }
  tr.mine td, .list-row.mine { background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }

  /* ---- cards ---- */
  .award-card, .position-card, .pod-card, .highlight-card, .recap-strip {
    border: 2px solid var(--line-strong); background: var(--surface-2); box-shadow: 3px 3px 0 rgba(0,0,0,.6);
  }
  .highlight-thumb { border-bottom: 2px solid var(--line-strong); }

  /* ---- misc ---- */
  .good { color: var(--good); } .bad { color: var(--bad); } .info { color: var(--info); }
  .skel { font-family: var(--font-display); font-size: 11px; color: var(--accent); animation: blink8 1s steps(1,end) infinite; }
  footer { font-size: 8px; line-height: 2; color: var(--text-faint); border-top: var(--pix) solid var(--line-strong); }
  .panel-note, .empty-note { font-family: var(--font-body); font-size: 17px; color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce) {
    .livepill, .skel { animation: none; }
  }
  @media (max-width: 640px) {
    body { font-size: 17px; }
    .wordmark { font-size: 16px; }
    .panel h2 { font-size: 9px; }
    .tabular, .num, .val, .pts, .pct, .value, table, td, th { font-size: 17px; }
  }

  /* ---- 8-bit fit pass: pixel glyphs are far wider than the original faces ---- */
  body { font-size: 18px; }

  /* names wrap instead of truncating to "Bisho…" */
  .matchup-row .name .tn { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; }
  .lu-name { white-space: normal !important; overflow: visible !important; text-overflow: clip !important; }
  .matchup { padding: 12px 13px; }
  .lu-row { font-size: 15px; gap: 8px; }
  .lu-pos, .lu-state { font-size: 13px; }

  /* status chips wrap rather than clipping mid-word */
  .alert-chip { font-size: 7px; line-height: 1.7; white-space: normal !important; padding: 4px 6px; }
  .alert-chips { gap: 5px; }

  /* every grid needs more column width now */
  .matchups { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 3px; }
  .award-cards { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 3px; }
  .position-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 3px; }
  .pod-grid { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  .highlight-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  /* scoreboard HUD numbers were rendering tiny */
  .board-meta { font-size: 9px; gap: 14px; flex-wrap: wrap; }
  .board-meta strong { font-family: var(--font-mono); font-size: 16px; color: var(--gold); }

  /* avatar placeholders read as blank white squares on turf */
  .avatar { background: #0A2412; border: 2px solid var(--line-strong); }

  @media (max-width: 760px) {
    .matchups, .award-cards, .pod-grid, .highlight-grid { grid-template-columns: 1fr; }
  }

  /* panels in the 2-col rows shouldn't stretch to the tallest neighbour */
  .grid { align-items: start; }
</style>
</head>
<body>


<header class="board">
  <div class="board-inner">
    <div class="wordmark">SHOW ME YOUR <span>TDs</span></div>
    <div class="board-meta">
      <span>WEEK <strong id="m-week">—</strong></span>
      <span><strong id="m-sims">—</strong> SEASON SIMS</span>
      <span id="m-updated"></span>
      <span><a class="arcade-link" href="arcade.html">&#9654; ARCADE</a></span>
      <span><a class="arcade-link" href="daily.html">&#9733; DAILY</a></span>
    </div>
  </div>
</header>

<div class="ticker" id="ticker"></div>

<div class="wrap">
  <main id="main">
    <div class="skel">Loading league data…</div>
  </main>

  <footer>
    <span>Odds: DraftKings via ESPN · Tendencies: nflverse (CC-BY-SA 4.0) · Scores/rosters: Sleeper &amp; ESPN</span>
    <span id="f-updated"></span>
  </footer>
</div>

<script>
async function main() {
  let data;
  try {
    const res = await fetch('data.json', {cache: 'no-store'});
    data = await res.json();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="skel">Could not load data.json — publish it alongside this page.</div>';
    return;
  }
  render(data);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pct(n) { return (n === null || n === undefined) ? '—' : n.toFixed(0) + '%'; }
function pct1(n) { return (n === null || n === undefined) ? '—' : n.toFixed(1) + '%'; }

let TEAMS = {};
function teamName(key) { return (TEAMS[key] && TEAMS[key].team_name) || key; }
function teamHandle(key) { return (TEAMS[key] && TEAMS[key].handle) || key; }
function avatarImg(key, size) {
  const url = TEAMS[key] && TEAMS[key].avatar;
  const cls = size ? ' ' + size : '';
  if (!url) return `<span class="avatar${cls}" aria-hidden="true"></span>`;
  return `<img class="avatar${cls}" src="${esc(url)}" alt="" loading="lazy">`;
}
function teamLabel(key, size) {
  return `${avatarImg(key, size)}<span class="tn">${esc(teamName(key))}</span>`;
}

function render(data) {
  TEAMS = data.teams || {};
  document.getElementById('m-week').textContent = data.week;
  document.getElementById('m-sims').textContent = data.sims.toLocaleString();
  const fmt = iso => iso ? new Date(iso).toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short'}) : '';
  document.getElementById('m-updated').textContent = 'DATA AS OF ' + fmt(data.generated_at).toUpperCase();
  document.getElementById('f-updated').textContent = 'Data generated ' + fmt(data.generated_at) +
    (data.live_fetched_at ? ' · Sleeper scores/injuries pulled ' + fmt(data.live_fetched_at) : '') +
    '. Refreshed when the pipeline runs, not continuously.';

  renderTicker(data);

  const s = data.standings || [];
  const leader = s[0];
  const user = s.find(r => r.is_user);

  document.getElementById('main').innerHTML = `
    <div class="grid">
      <section class="panel">
        <h2>Standings &amp; Odds <small>${data.sims.toLocaleString()} sims</small></h2>
        <div class="panel-body table-scroll">
          ${standingsTable(s)}
        </div>
      </section>
      <section class="panel gold-accent">
        <h2>Storylines</h2>
        <div class="panel-body">
          ${storylines(data)}
        </div>
      </section>
    </div>

    <section class="panel" style="margin-bottom:20px;">
      <h2>Week ${data.week} Matchups <small>${data.week_final ? 'final scores' : 'live Sleeper points · projected final'}</small></h2>
      <div class="panel-body">
        ${matchupCards(data.matchups, data.user_team, data.week_final)}
      </div>
    </section>

    <section class="panel gold-accent" style="margin-bottom:20px;">
      <h2>Rivalries <small>3 pods of 4 · every podmate twice a season</small></h2>
      <div class="panel-body">
        ${rivalriesSection(data.rivalries, data.user_team)}
      </div>
    </section>

    <section class="panel info-accent" style="margin-bottom:20px;">
      <h2>Model Sensitivity <small>same sim, different assumptions</small></h2>
      <div class="panel-body">
        ${sensitivitySection(data.sensitivity, data.user_team)}
      </div>
    </section>

    ${weeklyAwardsSection(data.weekly_awards)}

    <div class="grid">
      <section class="panel">
        <h2>Waiver Wire <small>league-wide, since the last check</small></h2>
        <div class="panel-body">
          ${waiverMoves(data.waivers)}
        </div>
      </section>
      <section class="panel">
        <h2>FAAB Remaining <small>of $100</small></h2>
        <div class="panel-body">
          ${faabBoard(data.waivers, data.user_team)}
        </div>
      </section>
    </div>

    <section class="panel" style="margin-bottom:20px;">
      <h2>Highlights <small>via ESPN</small></h2>
      ${recapStrip(data.recaps)}
      <div class="filter-row" id="hl-filters"></div>
      <div class="highlight-grid" id="hl-grid"></div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Team Tendencies <small>${data.tendencies ? 'nflverse play-by-play, wk ' + data.tendencies.weeks.join('-') : ''}</small></h2>
        <div class="panel-body table-scroll">
          ${tendenciesTable(data.tendencies)}
        </div>
        ${data.tendencies && data.tendencies.weeks.length < 4 ? '<div class="panel-note">Provisional — only ' + data.tendencies.weeks.length + ' week(s) of plays. Small samples, treat with caution.</div>' : ''}
      </section>
      <section class="panel info-accent">
        <h2>Market Watch</h2>
        <div class="panel-body">
          ${marketList(data.market)}
        </div>
      </section>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Top Performers <small>this week</small></h2>
        <div class="panel-body">
          ${performersList(data.top_performers)}
        </div>
      </section>
      <section class="panel">
        <h2>Injury Report</h2>
        <div class="panel-body">
          ${injuriesList(data.injuries)}
        </div>
      </section>
    </div>

    <section class="panel" style="margin-bottom:20px;">
      <h2>Injury Predictions <small>expected games missed, 10,000-sim harsh model</small></h2>
      <div class="panel-body">
        ${injuryPredictionsList(data.injury_predictions)}
      </div>
    </section>
  `;

  initHighlights(data.highlights || [], data.user_team);
}


// Shows the first `limit` rows and hides the rest behind a toggle. Rows are HTML strings whose first
// tag (a <div> or <tr>) gets a data-extra flag when it falls past the limit.
function markExtra(rows, limit) {
  return rows.map((r, i) => i < limit ? r : r.replace(/^(\s*<\w+)/, '$1 data-extra="1"'));
}
function moreButton(hidden, noun) {
  return `<button type="button" class="more-btn" aria-expanded="false">Show ${hidden} more ${esc(noun)}</button>`;
}
function collapsible(rows, limit, noun) {
  if (rows.length <= limit) return rows.join('');
  const hidden = rows.length - limit;
  return `<div class="collapsible" data-noun="${esc(noun)}" data-hidden="${hidden}">${markExtra(rows, limit).join('')}${moreButton(hidden, noun)}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.more-btn'); if (!b) return;
  const box = b.closest('.collapsible'); const open = box.classList.toggle('open');
  b.setAttribute('aria-expanded', open);
  b.textContent = open ? 'Show fewer' : `Show ${box.dataset.hidden} more ${box.dataset.noun}`;
});

function headshot(pid, pos) {
  if (pos === 'DEF') {
    return `<div class="headshot def">${esc(pid)}</div>`;
  }
  return `<img class="headshot" src="https://sleepercdn.com/content/nfl/players/${esc(pid)}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`;
}

function positionCard(entry) {
  if (!entry) return '';
  return `<div class="position-card">
    <div class="pos-label">${esc(entry.pos)}</div>
    ${headshot(entry.pid, entry.pos)}
    <div class="pname">${esc(entry.name)}</div>
    <div class="ppts">${entry.pts.toFixed(1)}</div>
    <div class="powner">${teamLabel(entry.team, 'sm')}</div>
  </div>`;
}

function weeklyAwardsSection(a) {
  if (!a || !a.week) return '';
  const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
  const potw = POS_ORDER.map(p => a.players_of_week[p]).filter(Boolean);
  const bench = POS_ORDER.map(p => a.benchwarmers_of_week[p]).filter(Boolean);
  return `
    <section class="panel gold-accent" style="margin-bottom:20px;">
      <h2>Week ${a.week} Awards</h2>
      <div class="award-cards">
        <div class="award-card best">
          <div>
            <div class="label">Best Team</div>
            <div class="value">${a.best_team.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.best_team.team)}</div>
          </div>
        </div>
        <div class="award-card worst">
          <div>
            <div class="label">Worst Team</div>
            <div class="value">${a.worst_team.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.worst_team.team)}</div>
          </div>
        </div>
        <div class="award-card">
          <div>
            <div class="label">Most Efficient</div>
            <div class="value">${a.most_efficient.efficiency}%</div>
            <div class="sub">${teamName(a.most_efficient.team)}</div>
          </div>
        </div>
        <div class="award-card">
          <div>
            <div class="label">Least Efficient</div>
            <div class="value">${a.least_efficient.efficiency}%</div>
            <div class="sub">${teamName(a.least_efficient.team)}</div>
          </div>
        </div>
        ${a.highest_pts_in_loss ? `<div class="award-card">
          <div>
            <div class="label">Highest Pts in a Loss</div>
            <div class="value">${a.highest_pts_in_loss.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.highest_pts_in_loss.team)}</div>
          </div>
        </div>` : ''}
        ${a.lowest_pts_in_win ? `<div class="award-card">
          <div>
            <div class="label">Lowest Pts in a Win</div>
            <div class="value">${a.lowest_pts_in_win.actual.toFixed(1)}</div>
            <div class="sub">${teamName(a.lowest_pts_in_win.team)}</div>
          </div>
        </div>` : ''}
      </div>
      <div class="panel-body" style="padding-top:18px;">
        <h2 style="padding:0 0 10px;font-size:17px;">Players of the Week</h2>
        <div class="position-grid" style="margin-bottom:20px;">
          ${potw.map(positionCard).join('')}
        </div>
        <h2 style="padding:0 0 10px;font-size:17px;">Benchwarmers of the Week</h2>
        <div class="position-grid" style="margin-bottom:20px;">
          ${bench.map(positionCard).join('')}
        </div>
        <h2 style="padding:0 0 10px;font-size:17px;">Lineup Efficiency <small style="font-family:var(--font-label);font-size:12px;color:var(--text-faint);">actual starters vs. best possible lineup</small></h2>
        ${a.efficiency_rank.map(r => `<div class="eff-row">
          <div class="eff-name">${teamLabel(r.team, 'sm')}</div>
          <div class="eff-bar-track"><div class="eff-bar-fill" style="width:${r.efficiency}%"></div></div>
          <div class="eff-pct">${r.efficiency}%</div>
        </div>`).join('')}
      </div>
    </section>`;
}

function recapStrip(recaps) {
  if (!recaps || !recaps.length) return '';
  return `<div class="recap-strip">${recaps.filter(r => r.link).map(r =>
    `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.headline || r.game)}</a>`
  ).join('')}</div>`;
}

function initHighlights(highlights, userTeam) {
  const owners = [...new Set(highlights.flatMap(h => h.owners || []))]
    .sort((a, b) => teamName(a).localeCompare(teamName(b)));
  const filters = document.getElementById('hl-filters');
  const grid = document.getElementById('hl-grid');
  if (!filters || !grid) return;
  if (!owners.length) {
    filters.innerHTML = '';
    grid.innerHTML = '<div class="empty-note">No highlights tagged to a team yet.</div>';
    return;
  }

  let active = owners.includes(userTeam) ? userTeam : owners[0];
  function draw() {
    filters.innerHTML = owners.map(o =>
      `<button class="filter-btn ${active===o?'active':''}" data-f="${esc(o)}">${teamLabel(o,'sm')}</button>`
    ).join('');
    const shown = highlights.filter(h => (h.owners||[]).includes(active));
    grid.innerHTML = shown.length ? collapsible(shown.map(highlightCard), 6, 'clips') :
      '<div class="empty-note">No highlights tagged to this team yet.</div>';
    filters.querySelectorAll('.filter-btn').forEach(b => {
      b.addEventListener('click', () => { active = b.dataset.f; draw(); });
    });
  }
  draw();
}

function highlightCard(h) {
  const tags = (h.owners || []).map(o => avatarImg(o, 'sm')).join('');
  const thumb = h.thumbnail ? `<img class="highlight-thumb" src="${esc(h.thumbnail)}" alt="" loading="lazy">`
                             : '<div class="highlight-thumb"></div>';
  return `<a class="highlight-card" href="${esc(h.video_url)}" target="_blank" rel="noopener">
    ${thumb}
    <div class="highlight-meta">
      <div class="highlight-headline">${esc(h.headline)}</div>
      <div class="highlight-tags">${tags}<span class="highlight-src">${esc(h.game || '')}</span></div>
    </div>
  </a>`;
}

function renderTicker(data) {
  const items = [];
  const s = data.standings || [];
  if (s[0]) items.push(`#1 seed pace: <b>${esc(teamName(s[0].team))}</b> (${pct(s[0].playoff_pct)} playoffs)`);
  const closest = [...(data.matchups||[])].sort((a,b) => Math.abs(a.a_winpct-50) - Math.abs(b.a_winpct-50))[0];
  if (closest) items.push(`Closest game: <b>${esc(teamName(closest.a))}</b> vs <b>${esc(teamName(closest.b))}</b> (${closest.a_winpct}/${closest.b_winpct})`);
  const t = data.tendencies;
  if (t && t.teams && t.teams.length) {
    const mostPass = [...t.teams].sort((a,b) => (b.xpass_residual||-1)-(a.xpass_residual||-1))[0];
    if (mostPass) items.push(`Most pass-heavy vs expected (NFL): <b>${esc(mostPass.team)}</b> (${(mostPass.xpass_residual*100).toFixed(0)}%)`);
  }
  const mv = (data.market && data.market.lines) ? Object.values(data.market.lines) : [];
  items.push(`Betting lines tracked: <b>${Object.keys(data.market && data.market.lines || {}).length / 2 | 0 || (mv.length ? Math.ceil(mv.length/2) : 0)}</b> games this week`);
  document.getElementById('ticker').innerHTML = items.map(i => `<div class="ticker-item">${i}</div>`).join('');
}

function standingsTable(rows) {
  if (!rows.length) return '<div class="empty-note">No standings data yet.</div>';
  return `<table>
    <thead><tr>
      <th>Team</th><th>Rec (proj)</th><th>Actual</th><th>PF</th><th>Playoff</th><th>Bye</th><th>Title</th><th>FAAB</th>
    </tr></thead>
    <tbody>
      ${rows.map(r => `<tr>
        <td><span class="team-cell"><span class="rank">${r.rank}</span>${teamLabel(r.team)}${r.is_user ? '<span class="you-flag">YOU</span>' : ''}</span></td>
        <td class="num">${r.proj_w}-${r.proj_l}</td>
        <td class="num">${r.actual_w}-${r.actual_l}</td>
        <td class="num">${r.pf.toFixed(1)}</td>
        <td class="num">${pct1(r.playoff_pct)}</td>
        <td class="num">${pct1(r.bye_pct)}</td>
        <td class="num">${pct1(r.title_pct)}</td>
        <td class="num">$${r.faab}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function sideBlock(team, side, proj, isUser, showTag) {
  const hasLive = side && side.live !== null && side.live !== undefined;
  const chips = (side && side.alerts || []).filter(a =>
      ['Out','Doubtful','IR','PUP','Sus','SUS','NA','Injured Reserve'].includes(a.inj) || a.state !== 'final')
    .map(a => `<span class="alert-chip ${['Out','IR','PUP','Sus','SUS','NA','Injured Reserve'].includes(a.inj) ? 'bad' : 'warn'}">${esc(a.name)} · ${esc(a.inj)}${a.inj_type ? ' (' + esc(a.inj_type) + ')' : ''}</span>`).join('');
  const parts = [];
  if (side) {
    if (side.done) parts.push(side.done + ' done');
    if (side.in_play) parts.push('<span class="livepill">' + side.in_play + ' live</span>');
    if (side.to_play) parts.push(side.to_play + ' to play');
  }
  return `
    <div class="matchup-row">
      <span class="name ${isUser?'user':''}">${teamLabel(team,'sm')}${showTag}</span>
      <span class="pts">${hasLive ? `<span class="now">${side.live.toFixed(1)}</span><span class="proj">proj ${proj}</span>` : proj}</span>
    </div>
    ${parts.length ? `<div class="progress-line">${parts.join(' · ')}</div>` : ''}
    ${chips ? `<div class="alert-chips">${chips}</div>` : ''}`;
}

function lineupDetails(team, side) {
  if (!side || !side.lineup || !side.lineup.length) return '';
  const label = {final:'FINAL', live:'LIVE', todo:'TO PLAY', bye:'BYE'};
  return `<details class="lineup-details"><summary>LINEUP · ${esc(teamName(team))}</summary>
    ${side.lineup.map(l => `<div class="lu-row">
      <span class="lu-pos">${esc(l.pos || '')}</span>
      <span class="lu-name">${esc(l.name)}${l.inj ? ` <span class="alert-chip ${['Out','IR','PUP','Sus','SUS','NA','Injured Reserve'].includes(l.inj) ? 'bad' : 'warn'}">${esc(l.inj)}</span>` : ''}</span>
      <span class="lu-state ${l.state}">${label[l.state] || ''}</span>
      <span class="lu-pts">${l.pts.toFixed(1)}</span>
    </div>`).join('')}
  </details>`;
}

function matchupCards(matchups, userTeam, weekFinal) {
  if (!matchups || !matchups.length) return '<div class="empty-note">No matchups posted yet.</div>';
  return `<div class="matchups">
    ${matchups.map(m => {
      const aUser = m.a === userTeam, bUser = m.b === userTeam;
      const aWinner = m.a_winpct >= m.b_winpct;
      const tie = m.a_winpct === m.b_winpct;
      const tagText = weekFinal ? 'WINNER' : 'PROJ. WIN';
      const aTag = aWinner && !tie ? `<span class="proj-tag">${tagText}</span>` : '';
      const bTag = !aWinner && !tie ? `<span class="proj-tag">${tagText}</span>` : '';
      return `<div class="matchup">
        ${sideBlock(m.a, m.a_side, m.a_pts, aUser, aTag)}
        <div class="matchup-row"><span class="pct">${m.a_winpct}% win</span><span class="pct">${m.b_winpct}% win</span></div>
        <div class="win-bar"><span style="width:${m.a_winpct}%"></span></div>
        <div class="matchup-vs">VS</div>
        ${sideBlock(m.b, m.b_side, m.b_pts, bUser, bTag)}
        ${lineupDetails(m.a, m.a_side)}${lineupDetails(m.b, m.b_side)}
      </div>`;
    }).join('')}
  </div>`;
}

function tendenciesTable(t) {
  if (!t || !t.teams || !t.teams.length) return '<div class="empty-note">Run tendencies.py to populate this.</div>';
  const rows = [...t.teams].sort((a,b) => b.epa_per_play_off - a.epa_per_play_off);
  const LIMIT = 10, hidden = Math.max(0, rows.length - LIMIT);
  return `<div class="collapsible" data-noun="teams" data-hidden="${hidden}"><table>
    <thead><tr>
      <th>Team</th><th>EPA/play (off)</th><th>EPA/play (def)</th><th>Pass rate</th><th>xPass +/-</th><th>Shotgun</th>
    </tr></thead>
    <tbody>
      ${markExtra(rows.map(r => `<tr>
        <td>${esc(r.team)}</td>
        <td class="num">${r.epa_per_play_off.toFixed(2)}</td>
        <td class="num">${(r.epa_per_play_def||0).toFixed(2)}</td>
        <td class="num">${pct(r.pass_rate*100)}</td>
        <td class="num">${r.xpass_residual!==null ? (r.xpass_residual>0?'+':'')+(r.xpass_residual*100).toFixed(0)+'%' : '—'}</td>
        <td class="num">${pct(r.shotgun_rate*100)}</td>
      </tr>`), LIMIT).join('')}
    </tbody>
  </table>${hidden ? moreButton(hidden, 'teams') : ''}</div>`;
}

function marketList(market) {
  const lines = (market && market.lines) ? market.lines : {};
  const seen = new Set();
  const games = [];
  for (const [team, l] of Object.entries(lines)) {
    const key = [team, l.opp].sort().join('-');
    if (seen.has(key)) continue;
    seen.add(key);
    const fav = l.spread < 0 ? team : l.opp;
    const dogSpread = Math.abs(l.spread);
    games.push({away: l.home ? l.opp : team, home: l.home ? team : l.opp, fav, spread: dogSpread,
               total: l.total, kickoff: l.kickoff});
  }
  if (!games.length) return '<div class="empty-note">No games with a posted line right now.</div>';
  games.sort((a, b) => (a.kickoff || '9999') < (b.kickoff || '9999') ? -1 : 1);
  const next = games[0];
  return games.map(g => `<div class="list-row">
    <div class="left">
      <div class="primary">${esc(g.away)} @ ${esc(g.home)} ${g === next ? '<span class="pill info">NEXT UP</span>' : ''}</div>
      <div class="secondary">${esc(g.fav)} favored${kickoffLabel(g.kickoff)}</div>
    </div>
    <div class="val">-${g.spread} · O/U ${g.total}</div>
  </div>`).join('');
}

function kickoffLabel(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return ' · ' + d.toLocaleString('en-US', {weekday:'short', hour:'numeric', minute:'2-digit', timeZoneName:'short'});
}

function performersList(list) {
  if (!list || !list.length) return '<div class="empty-note">No games played yet this week.</div>';
  return collapsible(list.map(p => `<div class="list-row">
    <div class="left">
      <div class="primary">${esc(p.name)} <span class="secondary">${esc(p.team)}</span></div>
      <div class="secondary" style="display:flex;align-items:center;gap:5px;">${p.owner ? teamLabel(p.owner,'sm') : 'free agent'}</div>
    </div>
    <div class="val">${p.pts.toFixed(1)}</div>
  </div>`), 6, 'players');
}

function injuriesList(list) {
  if (!list || !list.length) return '<div class="empty-note">No injuries reported this week.</div>';
  return collapsible(list.map(i => `<div class="list-row">
    <div class="left">
      <div class="primary">${esc(i.player)} <span class="secondary">${esc(i.team)}</span></div>
      <div class="secondary">${esc(i.type || '')}${i.owner ? ' · ' + esc(teamName(i.owner)) : ''}</div>
    </div>
    <span class="pill ${i.status === 'Out' || i.status === 'Doubtful' ? 'bad' : 'info'}">${esc(i.status || '')}</span>
  </div>`), 6, 'injuries');
}

function injuryPredictionsList(list) {
  if (!list || !list.length) return '<div class="empty-note">No meaningful injury risk projected right now.</div>';
  const maxG = Math.max(...list.map(r => r.expected_games_missed), 1);
  return collapsible(list.map(r => {
    const researched = !!(r.return_week || r.note);
    const statusPill = r.current_status ? `<span class="pill ${['Out','Doubtful','IR','PUP','NA','SUS'].includes(r.current_status) ? 'bad' : 'info'}">${esc(r.current_status)}</span>` : '';
    const returnPill = r.return_week ? `<span class="pill good">BACK WK ${r.return_week}</span>` : (researched ? '' : '<span class="pill info">MODEL EST.</span>');
    return `<div class="injpred-row">
      <div class="injpred-top">
        <div class="injpred-name">
          <span class="pname">${esc(r.name)}</span> <span class="secondary">${esc(r.pos || '')} · ${esc(r.nfl_team || '')}</span><br>
          <span class="secondary">${teamLabel(r.team, 'sm')}</span>
        </div>
        ${statusPill}
        ${returnPill}
        <div class="injpred-bar-track"><div class="injpred-bar-fill" style="width:${Math.min(100, r.expected_games_missed / maxG * 100)}%"></div></div>
        <div class="injpred-games">${r.expected_games_missed.toFixed(1)} gms</div>
      </div>
      ${r.note ? `<div class="injpred-note">${esc(r.note)}${r.source ? ' — <span style="opacity:.75">' + esc(r.source) + '</span>' : ''}</div>` : ''}
    </div>`;
  }), 6, 'players');
}

function waiverMoves(w) {
  const moves = (w && w.moves) || [];
  if (!moves.length) return '<div class="empty-note">No moves cleared since the last check.</div>';
  return collapsible(moves.map(m => {
    const add = m.added.map(p => `<span class="add">+${esc(p.name)}</span> <span class="secondary">(${esc(p.pos)})</span>`).join(', ') || '<span class="secondary">nothing</span>';
    const drop = m.dropped.map(p => `<span class="drop">-${esc(p.name)}</span> <span class="secondary">(${esc(p.pos)})</span>`).join(', ');
    const bid = m.type === 'waiver' ? `<span class="pill good">$${m.faab} FAAB</span>` : '<span class="pill info">FREE AGENT</span>';
    return `<div class="waiver-row">
      <div class="wmoves">
        ${teamLabel(m.team, 'sm')}<br>${add}${drop ? ', ' + drop : ''}
      </div>
      ${bid}
    </div>`;
  }), 8, 'moves');
}

function faabBoard(w, userTeam) {
  const left = (w && w.faab_left) || {};
  const rows = Object.entries(left).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return '<div class="empty-note">No FAAB data yet.</div>';
  return rows.map(([team, val]) => `<div class="faab-row">
    <div class="fname">${teamLabel(team, 'sm')}</div>
    <div class="faab-bar-track"><div class="faab-bar-fill" style="width:${val}%"></div></div>
    <div class="faab-val">$${val}</div>
  </div>`).join('');
}

function weekLabel(w) { return w ? `Week ${w}` : ''; }

function podStory(pod) {
  const lead = pod.members[0];
  const bits = [`<b>${esc(teamName(lead.team))}</b> leads this rivalry group at ${lead.pod_w}-${lead.pod_l} in-group (${pct1(lead.playoff_pct)} playoff odds overall).`];
  if (pod.closest_game) {
    const g = pod.closest_game;
    bits.push(`The tightest game so far: <b>${esc(teamName(g.a))}</b> over ${esc(teamName(g.b))} by just ${g.margin.toFixed(1)} in ${weekLabel(g.week)}.`);
  }
  if (pod.biggest_blowout && pod.biggest_blowout !== pod.closest_game) {
    const g = pod.biggest_blowout;
    bits.push(`Biggest gap: <b>${esc(teamName(g.a))}</b> by ${g.margin.toFixed(1)} over ${esc(teamName(g.b))} in ${weekLabel(g.week)}.`);
  }
  if (pod.next_game) {
    bits.push(`Next up: ${esc(teamName(pod.next_game.a))} vs ${esc(teamName(pod.next_game.b))} in ${weekLabel(pod.next_game.week)}.`);
  }
  return bits.join(' ');
}

function rivalriesSection(rivalries, userTeam) {
  if (!rivalries || !rivalries.length) return '<div class="empty-note">Rivalry pods not available yet.</div>';
  return `<div class="pod-grid">
    ${rivalries.map(pod => {
      const mine = pod.members.some(m => m.team === userTeam);
      return `<div class="pod-card ${mine ? 'mine' : ''}">
        <p class="pod-story">${podStory(pod)}</p>
        ${pod.members.map(m => `<div class="pod-row">
          <span class="team-cell">${teamLabel(m.team, 'sm')}${m.team === userTeam ? '<span class="you-flag">YOU</span>' : ''}</span>
          <span class="pod-rec">${m.pod_w}-${m.pod_l} grp</span>
          <span class="pod-po">${pct1(m.playoff_pct)}</span>
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

function sensitivitySection(sensitivity, userTeam) {
  if (!sensitivity || !sensitivity.teams || !sensitivity.teams.length) return '<div class="empty-note">Run sensitivity.py to populate this.</div>';
  const scenarios = sensitivity.scenarios;
  const rows = [...sensitivity.teams].sort((a, b) => a.team === userTeam ? -1 : b.team === userTeam ? 1 : b.playoff_pct.baseline - a.playoff_pct.baseline);
  return `
    <div class="sens-legend">
      ${scenarios.map(s => `<span title="${esc(s.note)}"><i style="background:${s.key === 'baseline' ? 'var(--accent)' : 'var(--info)'}"></i>${esc(s.label)}</span>`).join('')}
    </div>
    <div class="panel-note" style="padding:0 0 12px;border:none;margin:0;">Playoff odds under two alternate sets of assumptions, run alongside the baseline model — not a replacement for it. Bars span each team's low-to-high across all three; the orange tick marks the baseline.</div>
    ${rows.map(r => {
      const vals = scenarios.map(s => r.playoff_pct[s.key]);
      const lo = Math.min(...vals), hi = Math.max(...vals), base = r.playoff_pct.baseline;
      return `<div class="sens-row">
        <span class="sens-name">${teamLabel(r.team, 'sm')}</span>
        <div class="sens-range">
          <div class="sens-bar" style="left:${lo}%; width:${Math.max(1, hi - lo)}%"></div>
          <div class="sens-tick base" style="left:${base}%"></div>
        </div>
        <span class="sens-val">${lo.toFixed(0)}-${hi.toFixed(0)}% <span style="opacity:.6">(±${(r.playoff_spread/2).toFixed(1)})</span></span>
      </div>`;
    }).join('')}
  `;
}

function storylines(data) {
  const items = [];
  const s = data.standings || [];
  const user = s.find(r => r.is_user);
  if (user) items.push(`<b>${esc(teamName(user.team))}</b> sits ${user.rank}${ordinal(user.rank)} at ${pct1(user.playoff_pct)} to make the playoffs.`);
  const leader = s[0];
  if (leader) items.push(`<b>${esc(teamName(leader.team))}</b> leads the field at ${pct1(leader.title_pct)} title odds.`);
  const t = data.tendencies;
  if (t && t.teams && t.teams.length) {
    const best = [...t.teams].sort((a,b)=>b.epa_per_play_off-a.epa_per_play_off)[0];
    items.push(`<b>${esc(best.team)}</b> leads the league in offensive EPA/play (${best.epa_per_play_off.toFixed(2)}) so far.`);
  }
  if (!items.length) return '<div class="empty-note">Check back once more of the week has played.</div>';
  return items.map(i => `<div class="list-row" style="border:none;padding:9px 0 9px;line-height:1.45;">${i}</div>`).join('');
}

function ordinal(n) {
  const s = ['th','st','nd','rd'], v = n % 100;
  return s[(v-20)%10] || s[v] || s[0];
}

main();
</script>

</body>
</html>
